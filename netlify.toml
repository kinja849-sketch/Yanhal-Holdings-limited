[build]
  command = "npm run predeploy && npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/instagram/*"
  to = "/.netlify/functions/instagram"
  status = 200

[[redirects]]
  from = "/api/assistant/tts"
  to = "/.netlify/functions/assistant-tts"
  status = 200

[[redirects]]
  from = "/api/send-estimate"
  to = "/.netlify/functions/send-estimate"
  status = 200

[[redirects]]
  from = "/api/assistant/chat"
  to = "/.netlify/functions/assistant-chat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
